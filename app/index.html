<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archetypes</title>
  <link rel="stylesheet" href="style.css?v=24" />
</head>
<body>

  <header>
    <h1>Population Clusters</h1>
  </header>

  <div class="controls">
    <label for="cluster-type">Cluster method</label>
    <select id="cluster-type">
      <option value="values">Old school statistical clustering</option>
      <option value="llm_gemini">LLM Gemini</option>
      <option value="llm_claude">LLM Claude</option>
    </select>

    <span id="la-control" style="display:flex; align-items:center; gap:8px;">
      <label for="la-select">Local Authority</label>
      <select id="la-select" style="min-width:220px;">
        <option value="">— loading LAs —</option>
      </select>
    </span>
  </div>

  <main>
    <p class="summary-bar" id="summary-bar"></p>
    <div id="main-content"></div>
  </main>

  <script src="app.js?v=42"></script>
</body>
</html>
